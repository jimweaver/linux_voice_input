[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-input"
version = "0.1.0"
description = "Hotkey dictation for Linux: speak, get text typed into the focused app via OpenAI transcription"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "openai",
    "sounddevice",
    "numpy",
    "pynput",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
voice-input = "voice_input.__main__:main"

[tool.setuptools.packages.find]
include = ["voice_input*"]
